const safeUrl=(val)=>{let url=String(val||'').trim();if(!url)return '';try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}};
const photoSrc=ex=>{let v=ex?.photo||'';return v.startsWith('data:image/jpeg;base64,')||v.startsWith('data:image/png;base64,')||v.startsWith('data:image/webp;base64,')?v:safeUrl(v)};

function videoMarkup(ex){const val=safeUrl(ex.video);if(!val)return `<div class="media-empty"><span>▶</span><b>${T('noVideo')}</b></div>`;
 try{const u=new URL(val);const host=u.hostname.replace(/^www\./,'').replace(/^m\./,'');let id='';if(host==='youtu.be')id=u.pathname.split('/').filter(Boolean)[0]||'';if(host==='youtube.com'||host==='youtube-nocookie.com'){id=u.searchParams.get('v')||(u.pathname.match(/^\/(embed|shorts|live)\/([^/]+)/)||[])[2]||'';}if(/^[a-zA-Z0-9_-]{11}$/.test(id))return `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(T('watchVideo'))}" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a class="btn full ghost" target="_blank" rel="noopener noreferrer" href="${esc(val)}">${T('openVideo')}</a>`;
 if(/\.mp4($|\?)/i.test(u.pathname+u.search))return `<video controls playsinline preload="metadata" class="exercise-video" src="${esc(val)}"></video>`;
 }catch(e){}return `<a class="btn full primary" target="_blank" rel="noopener noreferrer" href="${esc(val)}">▶ ${T('openVideo')}</a>`;

function assignmentForm(){const tid=ui.template||db.templates.find(t=>t.items.length)?.id;return `<div class="view stack">${btn('← '+T('home'),'back-from-assign','back')}${topText(T('planAssignment'),T('assignWorkout'))}<form id="assign-form" class="card stack"><label class="field">${T('selectStudent')}<select name="student" required>${people().map(p=>`<option value="${esc(p.id)}" ${ui.pupil===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field">${T('selectTemplate')}<select name="template" required>${db.templates.filter(t=>t.items.length).map(t=>`<option value="${esc(t.id)}" ${tid===t.id?'selected':''}>${esc(workoutTitle(t))} · ${t.items.length}</option>`).join('')}</select></label><label class="field">${T('sessionDate')}<input name="date" type="date" value="${today()}" required></label><div class="soft small">${T('assignmentNote')}</div><button type="submit" class="btn primary full">${T('assignWorkout')} →</button></form></div>`}
function reportsList(){const list=db.assignments.filter(a=>a.status==='completed').slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="view stack">${topText(T('resultsControl'),T('reports'),T('reportsSub'))}<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat-card"><strong>${list.length}</strong><span>${T('completedCount')}</span></div><div class="stat-card"><strong>${db.assignments.filter(a=>a.status==='missed').length}</strong><span>${T('missedCount')}</span></div></div>${list.map(a=>`<button class="tile" type="button" data-report="${esc(a.id)}">${avatar(person(a.studentId))}<span class="grow"><span class="title">${esc(person(a.studentId)?.name)}</span><span class="subtitle">${esc(workoutTitle(a))} · ${formatDate(a.date)}</span><span class="small muted">${countDone(a)}/${countSets(a)} ${T('sets')} · RPE ${a.effort}/10</span></span><span class="arrow">›</span></button>`).join('')||`<div class="empty">${T('noReports')}</div>`}</div>`}
function reportDetail(){const a=job(ui.report);if(!a)return reportsList();return `<div class="view stack">${btn('← '+T('backReports'),'back-reports','back')}<p class="kicker">${formatDate(a.date)} · ${esc(person(a.studentId)?.name)}</p><h1 class="screen-heading">${esc(workoutTitle(a))}</h1><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat-card"><strong>${countDone(a)}/${countSets(a)}</strong><span>${T('setsLabel')}</span></div><div class="stat-card"><strong>${a.effort}/10</strong><span>${T('effort')}</span></div></div>
 ${a.items.map((item,i)=>{const logs=Array.from({length:item.sets},(_,j)=>a.logs[`${i}-${j}`]||null),done=logs.filter(x=>x?.done).length;return `<div class="card stack"><div class="spread"><b>${esc(displayName(item.id))}</b><span class="badge ${done===item.sets?'good':'warn'}">${done}/${item.sets}</span></div><div class="small muted">${T('planned')}: ${item.sets} × ${item.reps} · ${item.weight} ${T('kg')}</div>${logs.map((l,j)=>`<div class="spread small"><span>${T('set')} ${j+1}</span><b>${l?.done?l.weight+' '+T('kg')+' × '+l.reps:T('notDone')}</b></div>`).join('')}</div>`}).join('')}${a.note?`<div class="card"><b>${T('comment')}</b><p class="detail-paragraph">${esc(a.note)}</p></div>`:''}</div>`}
const studentNext=()=>db.assignments.filter(a=>a.studentId==='anna'&&['planned','active'].includes(a.status)).sort((a,b)=>a.status==='active'?-1:b.status==='active'?1:a.date.localeCompare(b.date))[0];
function studentView(){switch(ui.studentPage){case'home':return studentHome();case'workout':return studentWorkout();case'exercises':return exercisesList();case'exerciseDetail':return exerciseDetail(true);case'history':return studentHistory();default:return studentHome()}}
function studentHome(){const arr=jobs('anna'),next=studentNext(),done=arr.filter(a=>a.status==='completed').length;return `<div class="view stack">${topText(T('pupilArea'),T('hello'),T('pupilSub'))}<section class="hero"><div class="eyebrow">${next?T('nextWorkout')+' · '+formatDate(next.date):T('allFinished')}</div><h2>${esc(next?.title||T('restDay'))}</h2><p>${next?next.items.length+' '+T('exercisesCount')+' · '+countSets(next)+' '+T('sets')+' · ~45 min':T('planDone')}</p>${next?btn('▶ '+T(next.status==='active'?'continueWorkout':'startWorkout'),'start-workout','btn dark'):''}</section><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat-card"><strong>${done}</strong><span>${T('workoutsCompleted')}</span></div><div class="stat-card"><strong>${pct(done,arr.length)}%</strong><span>${T('planCompletion')}</span>${progress(done,arr.length)}</div></div>${section(T('myWorkouts'))}${arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(a=>`<div class="card spread"><span class="grow"><b>${esc(workoutTitle(a))}</b><span class="small muted" style="display:block">${formatDate(a.date)}</span></span><span class="badge ${badge(a)}">${status(a)}</span></div>`).join('')||`<div class="empty">${T('noAssigned')}</div>`}</div>`}
function studentWorkout(){const a=studentNext();if(!a)return `<div class="view stack">${topText('',T('workout'))}<div class="card empty">${T('noAssigned')}</div>${btn(T('history')+' →','student-history','btn full')}</div>`;const n=countDone(a),total=countSets(a);return `<div class="view stack">${topText(formatDate(a.date),esc(workoutTitle(a)))}<div class="spread small muted"><span>${T('setsDone')}</span><strong>${n} ${T('of')} ${total}</strong></div>${progress(n,total)}
 ${a.items.map((item,i)=>`<section class="exercise stack"><div class="spread"><div class="row grow">${exThumb(exercise(item.id)||{id:item.id})}<div class="grow"><div class="ex-name">${esc(displayName(item.id))}</div><span class="small muted">${T('planLine')}: ${item.sets} × ${item.reps} · ${T('rest')} ${item.rest}s</span></div></div><button type="button" class="btn sm ghost" data-student-ex="${esc(item.id)}" aria-label="${T('exerciseInstructions')}">ⓘ</button></div>
 <div class="set-header"><span>${T('setNo')}</span><span>${T('weightLabel')}</span><span>${exercise(item.id)?.unit==='seconds'?T('seconds'):T('repeat')}</span><span>✓</span></div>${Array.from({length:item.sets},(_,j)=>{const log=a.logs[`${i}-${j}`]||{weight:item.weight,reps:item.reps,done:false};return `<div class="set-item"><span class="index">${j+1}</span><input class="input-mini" type="number" aria-label="Weight" min="0" max="1000" step="0.5" data-log="${i}:${j}:weight" value="${log.weight}"><input class="input-mini" type="number" aria-label="Repetitions" min="0" max="999" step="1" data-log="${i}:${j}:reps" value="${log.reps}"><button type="button" data-check="${i}:${j}" class="${log.done?'checked':''}" aria-label="Complete set">${log.done?'✓':'○'}</button></div>`}).join('')}</section>`).join('')}
 <section class="card stack">${section(T('finish'))}<label class="field">${T('rpeLabel')} <b id="rpe-output">${a.effort}/10</b><input id="rpe" type="range" min="1" max="10" value="${a.effort}" style="width:100%;accent-color:#2469e9;min-height:45px"></label><label class="field">${T('noteCoach')}<textarea id="student-note" placeholder="${T('notePlaceholder')}">${esc(a.note||'')}</textarea></label><button type="button" class="btn primary full" data-action="finish-workout" ${n?'':'disabled'}>${T('finishWorkout')} · ${n}/${total} →</button>${n?'':`<div class="small muted">${T('markOne')}</div>`}</section></div>`}
function studentHistory(){const list=jobs('anna').filter(a=>a.status==='completed').sort((a,b)=>b.date.localeCompare(a.date));return `<div class="view stack">${topText(T('historySub'),T('history'))}${list.map(a=>`<div class="card stack"><div class="spread"><div><b>${esc(workoutTitle(a))}</b><div class="small muted">${formatDate(a.date)}</div></div><span class="badge good">${T('complete')}</span></div><div class="small muted">${countDone(a)}/${countSets(a)} ${T('sets')} · RPE ${a.effort}/10</div>${a.note?`<div class="details">${esc(a.note)}</div>`:''}</div>`).join('')||`<div class="empty">${T('noHistory')}</div>`}</div>`}
function go(page){ui.exSearch='';ui.exGroup='all';if(ui.role==='coach'){ui.page=page;ui.pupil=null;ui.template=null;ui.report=null;ui.pickerTemplateId=null}else ui.studentPage=page;render()}
function openNewExercise(fromPicker=false){ui.formId=null;ui.formDraft={id:uuid('ex'),custom:true,group:'chest',unit:'reps',equipment:'',primary:ui.lang,name:{},desc:{},faq:{},photo:'',video:''};ui.returnPage=fromPicker?'picker':'exercises';ui.page='exerciseForm';render()}
function chooseExercise(id){const t=templ(ui.pickerTemplateId),ex=exercise(id);if(!t||!ex)return;t.items.push({id,sets:3,reps:ex.unit==='seconds'?45:10,weight:0,rest:90});save();ui.template=t.id;ui.pickerTemplateId=null;ui.page='templates';ui.exSearch='';render();flash(T('added'))}
function handleAction(action){if(action==='open-assign'){ui.page='assign';render();return}if(action==='goto-reports'){go('reports');return}if(action==='go-exercises'){go('exercises');return}if(action==='new-exercise'){openNewExercise();return}if(action==='new-from-picker'){openNewExercise(true);return}
 if(action==='new-template'){const id=uuid('t');db.templates.push({id,title:T('newTemplate'),items:[]});save();ui.template=id;ui.page='templates';render();return}if(action==='back-templates'){ui.template=null;ui.page='templates';render();return}if(action==='open-picker'){ui.pickerTemplateId=ui.template;ui.page='picker';ui.exGroup='all';ui.exSearch='';render();return}if(action==='back-to-template'){ui.template=ui.pickerTemplateId;ui.pickerTemplateId=null;ui.page='templates';render();return}
 if(action==='save-template'){const t=templ(ui.template),title=stage.querySelector('#template-name')?.value.trim();if(t&&title){if(title!==t.title){t.title=title.slice(0,70);delete t.titleI18n}save();flash(T('templateSaved'))}else flash(T('templateNameNeeded'));return}
 if(action==='invite-toggle'){ui.invite=!ui.invite;render(true);return}if(action==='back-students'){ui.pupil=null;render();return}if(action==='back-from-assign'){ui.page=ui.pupil?'students':'dashboard';render();return}if(action==='back-reports'){ui.report=null;render();return}if(action==='activate'){const p=person(ui.pupil);if(p){p.joined=true;save();render();}return}
 if(action==='back-exercises'){if(ui.role==='student'){ui.studentPage=ui.studentReturn;render()}else{ui.page=ui.returnPage==='templates'?'templates':'exercises';render()}return}
 if(action==='edit-exercise'){ui.formId=ui.exerciseId;ui.formDraft=clone(exercise(ui.exerciseId));ui.returnPage='exerciseDetail';ui.page='exerciseForm';render();return}
 if(action==='cancel-exercise'){ui.formDraft=null;ui.page=ui.returnPage==='exerciseDetail'?'exerciseDetail':ui.returnPage==='picker'?'picker':'exercises';render();return}
 if(action==='remove-photo'){captureDraft();ui.formDraft.photo='';render(true);return}
 if(action==='delete-exercise'){const id=ui.exerciseId,ex=exercise(id);if(!ex?.custom)return;const used=db.templates.some(t=>t.items.some(i=>i.id===id))||db.assignments.some(a=>a.items.some(i=>i.id===id));if(used){flash(T('cantDelete'));return}if(!confirm(T('deleteConfirm')))return;delete db.exercises[id];save();ui.exerciseId=null;ui.page='exercises';render();flash(T('deleted'));return}
 if(action==='start-workout'){const a=studentNext();if(a){a.status='active';save()}ui.studentPage='workout';render();return}if(action==='student-history'){ui.studentPage='history';render();return}if(action==='finish-workout'){const a=studentNext();if(!a||!countDone(a))return;a.note=stage.querySelector('#student-note')?.value.trim()||'';a.status='completed';save();ui.studentPage='history';render();flash(T('finishedFlash'));return}
 if(action.startsWith('report:')){ui.report=action.slice(7);ui.page='reports';render()}
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.role){ui.role=b.dataset.role;ui.page='dashboard';ui.studentPage='home';ui.pupil=null;ui.template=null;ui.report=null;ui.pickerTemplateId=null;render();return}
 if(b.dataset.page){go(b.dataset.page);return}
 if(b.dataset.pupil){ui.pupil=b.dataset.pupil;ui.page='students';render();return}
 if(b.dataset.template){ui.template=b.dataset.template;ui.page='templates';render();return}
 if(b.dataset.report){ui.report=b.dataset.report;ui.page='reports';render();return}
 if(b.dataset.filter){ui.filter=b.dataset.filter;render(true);return}
 if(b.dataset.exGroup){ui.exGroup=b.dataset.exGroup;render(true);return}
 if(b.dataset.pick){chooseExercise(b.dataset.pick);return}
 if(b.dataset.studentEx){ui.exerciseId=b.dataset.studentEx;ui.studentReturn='workout';ui.studentPage='exerciseDetail';render();return}
 if(b.dataset.exercise){ui.exerciseId=b.dataset.exercise;if(ui.role==='student'){ui.studentReturn='exercises';ui.studentPage='exerciseDetail'}else{ui.returnPage=ui.page==='templates'?'templates':'exercises';ui.page='exerciseDetail'}render();return}
 if(b.dataset.remove!==undefined){const t=templ(ui.template),i=Number(b.dataset.remove);if(t&&Number.isInteger(i)&&i>=0&&i<t.items.length){t.items.splice(i,1);save();render(true)}return}
 if(b.dataset.check){const a=studentNext();if(!a)return;const [i,j]=b.dataset.check.split(':').map(Number),ex=a.items[i];if(!ex||j<0||j>=ex.sets)return;const key=`${i}-${j}`,l=a.logs[key]||{weight:ex.weight,reps:ex.reps,done:false};l.done=!l.done;a.logs[key]=l;a.status='active';save();render(true);return}
 if(b.dataset.action)handleAction(b.dataset.action);
});
root.addEventListener('submit',e=>{const f=e.target;if(!f.matches('form'))return;e.preventDefault();const fd=new FormData(f);
 if(f.id==='exercise-form'){captureDraft();const d=ui.formDraft,p=d.primary||ui.lang;if(!d.name?.[p]?.trim()){flash(T('requiredName'));return}if(d.photo&&!d.photo.startsWith('data:image/')&&!safeUrl(d.photo)||d.video&&!safeUrl(d.video)){flash(T('invalidUrl'));return}if(!groupKeys.includes(d.group))d.group='other';if(!locales.includes(d.primary))d.primary=ui.lang;d.name=Object.fromEntries(locales.map(k=>[k,(d.name[k]||'').slice(0,100)]));d.desc=Object.fromEntries(locales.map(k=>[k,(d.desc[k]||'').slice(0,1500)]));d.faq=Object.fromEntries(locales.map(k=>[k,(d.faq[k]||'').slice(0,1200)]));d.equipment=(d.equipment||'').slice(0,120);const id=ui.formId||d.id||uuid('ex'),prev=exercise(id);db.exercises[id]={...clone(d),id,custom:prev?.custom??true};if(!save()){if(prev)db.exercises[id]=prev;else delete db.exercises[id];flash(T('uploadFailed'));return}ui.formDraft=null;ui.formId=null;ui.exerciseId=id;if(ui.returnPage==='picker'&&ui.pickerTemplateId){chooseExercise(id)}else{ui.page='exerciseDetail';ui.returnPage='exercises';render();flash(T('savedExercise'))}return}
 if(f.id==='invite-form'){let name=String(fd.get('name')||'').trim();if(!name)return;db.students.push({id:uuid('s'),name:name.slice(0,35),goal:T('none'),joined:false});save();ui.invite=false;render();flash(T('demoInvite'));return}
 if(f.id==='assign-form'){const sid=String(fd.get('student')||''),tid=String(fd.get('template')||''),date=String(fd.get('date')||''),p=person(sid),t=templ(tid);if(!p?.joined||!t?.items.length||!/^\d{4}-\d{2}-\d{2}$/.test(date)){flash(T('assignValidation'));return}db.assignments.push({id:uuid('a'),studentId:sid,templateId:tid,title:t.title,titleI18n:clone(t.titleI18n||{}),date,status:'planned',items:clone(t.items),logs:{},note:'',effort:6});save();ui.page='students';ui.pupil=sid;render();flash(T('assignedFlash'));return}
});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='student-search'||t.id==='exercise-search'){const val=t.value;const pos=t.selectionStart;if(t.id==='student-search'){ui.search=val;render(true);const input=stage.querySelector('#student-search');input?.focus();try{input?.setSelectionRange(pos,pos)}catch(e){}}else{ui.exSearch=val;const box=stage.querySelector('#exercise-cards');if(box)box.innerHTML=exerciseCards(ui.page==='picker');}return}
 if(t.id==='rpe'){stage.querySelector('#rpe-output').textContent=t.value+'/10';const a=studentNext();if(a){a.effort=clamp(t.value,1,10,6);save()}return}
 if(t.id==='student-note'){const a=studentNext();if(a){a.note=t.value;save()}return}
});
root.addEventListener('change',e=>{const t=e.target;
 if(t.id==='language-switch'){if(ui.page==='exerciseForm')captureDraft();ui.lang=locales.includes(t.value)?t.value:'ru';try{localStorage.setItem(LANGKEY,ui.lang)}catch(e){}render(true);return}
 if(t.id==='template-name'){const x=templ(ui.template);if(x&&t.value.trim()){if(x.title!==t.value.trim()){x.title=t.value.trim().slice(0,70);delete x.titleI18n}save()}return}
 if(t.dataset.edit){const x=templ(ui.template);if(!x)return;const [idx,k]=t.dataset.edit.split(':'),item=x.items[Number(idx)];if(!item||!['sets','reps','weight','rest'].includes(k))return;item[k]=clamp(t.value,k==='sets'||k==='reps'?1:0,k==='sets'?20:1000,item[k]);if(k!=='weight')item[k]=Math.floor(item[k]);t.value=item[k];save();return}
 if(t.dataset.log){const a=studentNext();if(!a)return;const [i,j,k]=t.dataset.log.split(':'),item=a.items[Number(i)];if(!item||!['weight','reps'].includes(k)||Number(j)>=item.sets)return;const key=`${i}-${j}`,log=a.logs[key]||{weight:item.weight,reps:item.reps,done:false};log[k]=clamp(t.value,0,k==='weight'?1000:999,log[k]);if(k==='reps')log[k]=Math.floor(log[k]);t.value=log[k];a.logs[key]=log;save();return}
 if(t.id==='photo-upload'){const file=t.files?.[0];if(!file)return;if(file.size>5*1024*1024){flash(T('fileLarge'));t.value='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){flash(T('photoType'));t.value='';return}captureDraft();const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{try{let max=920,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*ratio)),h=Math.max(1,Math.round(img.naturalHeight*ratio));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw Error('canvas');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);ui.formDraft.photo=canvas.toDataURL('image/jpeg',0.76);render(true);flash(T('photo')+' ✓')}catch(err){flash(T('uploadFailed'))}};img.onerror=()=>flash(T('uploadFailed'));img.src=String(reader.result)};reader.onerror=()=>flash(T('uploadFailed'));reader.readAsDataURL(file);return}
});
// Language switch lives in the header outside of stage and is handled above.
if(new URLSearchParams(location.search).has('reset')){db=seed();save()}
render();
})();
</script></body></html>
